
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interior Gallery | Mankar Furniture & Interiors</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery-page {
      min-height: 80vh;
      padding: 60px 7%;
      background: #faf7f0;
    }

    .gallery-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .gallery-heading h1 {
      margin-bottom: 12px;
    }

    .gallery-back {
      display: inline-block;
      margin-bottom: 25px;
      color: #98713b;
      text-decoration: none;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
    }

    .gallery-item {
      overflow: hidden;
      background: white;
      border-radius: 8px;
      box-shadow: 0 5px 20px #00000012;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: 260px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.04);
    }

    .gallery-item p {
      padding: 14px;
      margin: 0;
      color: #4a3928;
      text-align: center;
    }

    .gallery-empty {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html#home" class="brand">
      <span class="brand-mark">M</span>
      <span class="brand-name">MANKAR
        <small>FURNITURE & INTERIORS</small>
      </span>
    </a>
    <a class="outline-button" href="index.html#services">BACK TO SERVICES</a>
  </header>

  <main class="gallery-page">
    <a class="gallery-back" href="index.html#services">← Back to all services</a>

    <div class="gallery-heading">
      <p class="eyebrow">OUR WORK</p>
      <h1 id="galleryTitle">Interior Gallery</h1>
      <p>Explore our interior designs and craftsmanship.</p>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
    <p class="gallery-empty" id="galleryMessage" hidden></p>
  </main>

  <footer>
    <p>MANKAR FURNITURE & INTERIORS</p>
    <p>We Furnish the Dreams...!</p>
    <small>© <span id="year"></span> Mankar Furniture & Interiors. All rights reserved.</small>
  </footer>

  <script src="gallery.js"></script>
</body>
</html>
